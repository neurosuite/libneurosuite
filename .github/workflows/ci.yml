name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            os: ubuntu-24.04
            webengine: ON
          - name: ubuntu-24.04 without WebEngine
            os: ubuntu-24.04
            webengine: OFF
          - name: macos-14
            os: macos-14
            webengine: ON
          - name: windows
            os: windows-latest
            webengine: ON
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build qt6-base-dev libgl-dev
          if [ "${{ matrix.webengine }}" = ON ]; then sudo apt-get install -y --no-install-recommends qt6-webengine-dev; fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt ninja
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> "$GITHUB_ENV"

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
          -DWITH_WEBENGINE=${{ matrix.webengine }}
          -DWITH_TEST=ON

      - name: Build
        run: cmake --build build

      - name: Install
        run: cmake --install build

      - name: Check exported CMake package
        shell: bash
        run: |
          cmake -S test/consumer -B build-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install;${CMAKE_PREFIX_PATH}"
          cmake --build build-consumer

      - name: Package (Linux)
        if: runner.os == 'Linux' && matrix.webengine == 'ON'
        run: cd build && cpack -G DEB

      - uses: actions/upload-artifact@v4
        with:
          name: libneurosuite-${{ matrix.os }}-webengine-${{ matrix.webengine }}
          path: |
            install/
            build/*.deb
          if-no-files-found: ignore

  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build -L .#libneurosuite .#libneurosuite-nowebengine
